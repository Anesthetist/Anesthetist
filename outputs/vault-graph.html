<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    font-weight: 300;
    letter-spacing: -0.025em;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 20px 32px 16px;
    background: linear-gradient(180deg, #22253A 0%, #22253Aee 70%, #22253A00 100%);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
  }

  #header > * { pointer-events: auto; }

  .header-left h1 {
    font-weight: 400;
    font-size: 22px;
    color: #F5F5F0;
    letter-spacing: -0.025em;
    line-height: 1.2;
  }

  .header-left .subtitle {
    font-weight: 300;
    font-size: 13px;
    color: #5FC89B;
    opacity: 0.8;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  #search-container {
    position: relative;
  }

  #search {
    background: rgba(95, 200, 155, 0.08);
    border: 1px solid rgba(95, 200, 155, 0.2);
    border-radius: 8px;
    padding: 8px 14px 8px 36px;
    color: #F5F5F0;
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: -0.025em;
    width: 260px;
    outline: none;
    transition: border-color 0.3s, background 0.3s;
  }

  #search:focus {
    border-color: rgba(95, 200, 155, 0.5);
    background: rgba(95, 200, 155, 0.12);
  }

  #search::placeholder { color: rgba(245, 245, 240, 0.3); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(95, 200, 155, 0.4);
    font-size: 14px;
  }

  #stats-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 12px 32px;
    background: linear-gradient(0deg, #22253A 0%, #22253Aee 70%, #22253A00 100%);
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 12px;
    font-weight: 300;
    pointer-events: none;
  }

  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-value { font-weight: 400; color: #5FC89B; }
  .stat-label { color: rgba(245, 245, 240, 0.5); }

  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: auto;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: rgba(245, 245, 240, 0.5);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .legend-line {
    width: 20px;
    height: 2px;
  }

  #graph-container {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
  }

  svg { width: 100%; height: 100%; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #2a2d44;
    border: 1px solid rgba(95, 200, 155, 0.25);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 200;
    max-width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
  }

  #tooltip .tt-title {
    font-weight: 400;
    font-size: 14px;
    color: #F5F5F0;
    margin-bottom: 6px;
  }

  #tooltip .tt-status {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  #tooltip .tt-connections {
    color: rgba(245, 245, 240, 0.5);
    font-size: 11px;
  }

  /* Side Panel */
  #side-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 380px;
    height: 100vh;
    background: #1a1c2e;
    border-left: 1px solid rgba(95, 200, 155, 0.15);
    z-index: 150;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
    padding: 28px;
    box-shadow: -8px 0 32px rgba(0,0,0,0.3);
  }

  #side-panel.open { transform: translateX(0); }

  #side-panel .panel-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: rgba(245, 245, 240, 0.4);
    font-size: 20px;
    cursor: pointer;
    transition: color 0.2s;
    font-family: 'Poppins', sans-serif;
  }

  #side-panel .panel-close:hover { color: #5FC89B; }

  .panel-title {
    font-weight: 400;
    font-size: 20px;
    color: #F5F5F0;
    margin-bottom: 4px;
    padding-right: 32px;
    line-height: 1.3;
  }

    font-size: 11px;
    color: rgba(95, 200, 155, 0.6);
    font-family: monospace;
    letter-spacing: 0;
    margin-bottom: 12px;
  }

    display: inline-block;
    padding: 3px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
  }

  .panel-section {
    margin-bottom: 20px;
  }

    font-weight: 400;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(245, 245, 240, 0.35);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(95, 200, 155, 0.08);
  }

  .panel-link {
    display: block;
    padding: 6px 10px;
    margin: 3px 0;
    background: rgba(95, 200, 155, 0.06);
    border-radius: 6px;
    color: #5FC89B;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    text-decoration: none;
    font-weight: 300;
  }

  .panel-link:hover {
    background: rgba(95, 200, 155, 0.14);
    transform: translateX(3px);
  }

  .panel-empty {
    color: rgba(245, 245, 240, 0.2);
    font-size: 12px;
    font-style: italic;
    padding: 4px 0;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(95, 200, 155, 0.3)); }

// ============================================
// Build edges from node relationship data
// ============================================
const nodeMap = {};
graphData.nodes.forEach(n => { nodeMap[n.id] = n; });

const edgeSet = new Set();
function addEdge(source, target, type) {
  if (!nodeMap[source] || !nodeMap[target]) return;
  if (source === target) return;
  const key = [source, target].sort().join('|') + '|' + type;
  if (edgeSet.has(key)) return;
  edgeSet.add(key);
  graphData.edges.push({ source, target, type });
}

graphData.nodes.forEach(n => {
  (n.broader || []).forEach(t => addEdge(n.id, t, 'hierarchical'));
  (n.narrower || []).forEach(t => addEdge(n.id, t, 'hierarchical'));
  (n.related || []).forEach(t => addEdge(n.id, t, 'related'));
});

// Count connections
const connCount = {};
graphData.edges.forEach(e => {
  const s = typeof e.source === 'string' ? e.source : e.source.id;
  const t = typeof e.target === 'string' ? e.target : e.target.id;
  connCount[s] = (connCount[s] || 0) + 1;
  connCount[t] = (connCount[t] || 0) + 1;
});
graphData.nodes.forEach(n => { n.connections = connCount[n.id] || 0; });

// Update stats
const statusCounts = { canonical: 0, review: 0, draft: 0 };
graphData.nodes.forEach(n => { statusCounts[n.status] = (statusCounts[n.status] || 0) + 1; });
document.getElementById('stat-nodes').textContent = graphData.nodes.length;
document.getElementById('stat-edges').textContent = graphData.edges.length;
document.getElementById('stat-canonical').textContent = statusCounts.canonical;
document.getElementById('stat-review').textContent = statusCounts.review;
document.getElementById('stat-draft').textContent = statusCounts.draft;

// ============================================
// D3 Force-Directed Graph
// ============================================
const width = window.innerWidth;
const height = window.innerHeight;

const statusColor = {
  canonical: '#5FC89B',
  review: '#E8B84A',
  draft: '#8B9DAF'
};

const svg = d3.select('#graph')
  .attr('viewBox', [0, 0, width, height]);

// Defs for glow effect
const defs = svg.append('defs');
const glowFilter = defs.append('filter').attr('id', 'glow');
glowFilter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'coloredBlur');
const feMerge = glowFilter.append('feMerge');
feMerge.append('feMergeNode').attr('in', 'coloredBlur');
feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

// Size scale
const sizeScale = d3.scaleSqrt()
  .domain([0, d3.max(graphData.nodes, d => d.connections)])
  .range([4, 28]);

const simulation = d3.forceSimulation(graphData.nodes)
  .force('link', d3.forceLink(graphData.edges).id(d => d.id).distance(d => {
    return d.type === 'hierarchical' ? 80 : 120;
  }).strength(d => d.type === 'hierarchical' ? 0.4 : 0.15))
  .force('charge', d3.forceManyBody().strength(d => -Math.max(80, d.connections * 12)))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => sizeScale(d.connections) + 8))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 5])
  .on('zoom', (event) => {
    g.attr('transform', event.transform);
  });

svg.call(zoom);

// Initial zoom to fit
svg.call(zoom.transform, d3.zoomIdentity.translate(width * 0.05, height * 0.05).scale(0.9));

// Links
const link = g.append('g')
  .selectAll('line')
  .data(graphData.edges)
  .join('line')
  .attr('stroke', d => d.type === 'hierarchical' ? 'rgba(95, 200, 155, 0.45)' : 'rgba(95, 200, 155, 0.15)')
  .attr('stroke-width', d => d.type === 'hierarchical' ? 1.5 : 0.8)
  .attr('stroke-dasharray', d => d.type === 'related' ? '4,4' : 'none');

// Nodes
const node = g.append('g')
  .selectAll('g')
  .data(graphData.nodes)
  .join('g')
  .attr('cursor', 'pointer')
  .call(d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended));

// Node circles
node.append('circle')
  .attr('r', d => sizeScale(d.connections))
  .attr('fill', d => statusColor[d.status] || '#8B9DAF')
  .attr('fill-opacity', 0.85)
  .attr('stroke', d => statusColor[d.status] || '#8B9DAF')
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.4)
  .style('filter', d => d.connections > 8 ? 'url(#glow)' : 'none');

// Labels for nodes with enough connections
node.filter(d => d.connections >= 4 || d.status === 'canonical')
  .append('text')
  .text(d => d.title.length > 22 ? d.title.slice(0, 20) + '...' : d.title)
  .attr('x', d => sizeScale(d.connections) + 5)
  .attr('y', 4)
  .attr('fill', '#F5F5F0')
  .attr('fill-opacity', 0.7)
  .attr('font-size', d => d.connections > 10 ? '11px' : '9px')
  .attr('font-family', 'Poppins, sans-serif')
  .attr('font-weight', d => d.connections > 10 ? '400' : '300')
  .attr('letter-spacing', '-0.025em')
  .style('pointer-events', 'none');

// Tooltip
const tooltip = d3.select('#tooltip');

node.on('mouseover', function(event, d) {
  const statusColors = { canonical: '#5FC89B', review: '#E8B84A', draft: '#8B9DAF' };
  const statusBg = { canonical: 'rgba(95,200,155,0.15)', review: 'rgba(232,184,74,0.15)', draft: 'rgba(139,157,175,0.15)' };

  tooltip.html(`
    <div class="tt-title">${d.title}</div>
    <span class="tt-status" style="background:${statusBg[d.status]};color:${statusColors[d.status]}">${d.status}</span>
    <div class="tt-connections">${d.connections} connection${d.connections !== 1 ? 's' : ''}</div>
  `)
    .style('left', (event.clientX + 16) + 'px')
    .style('top', (event.clientY - 10) + 'px')
    .style('opacity', 1);

  // Highlight connected
  const connected = new Set();
  graphData.edges.forEach(e => {
    const s = typeof e.source === 'string' ? e.source : e.source.id;
    const t = typeof e.target === 'string' ? e.target : e.target.id;
    if (s === d.id) connected.add(t);
    if (t === d.id) connected.add(s);
  });

  node.select('circle')
    .attr('fill-opacity', n => n.id === d.id || connected.has(n.id) ? 1 : 0.12)
    .attr('stroke-opacity', n => n.id === d.id || connected.has(n.id) ? 0.8 : 0.05);

  node.selectAll('text')
    .attr('fill-opacity', n => n.id === d.id || connected.has(n.id) ? 1 : 0.08);

  link
    .attr('stroke-opacity', e => {
      const s = typeof e.source === 'string' ? e.source : e.source.id;
      const t = typeof e.target === 'string' ? e.target : e.target.id;
      return s === d.id || t === d.id ? 1 : 0.03;
    })
    .attr('stroke-width', e => {
      const s = typeof e.source === 'string' ? e.source : e.source.id;
      const t = typeof e.target === 'string' ? e.target : e.target.id;
      if (s === d.id || t === d.id) return e.type === 'hierarchical' ? 2.5 : 1.5;
      return e.type === 'hierarchical' ? 1.5 : 0.8;
    });

  d3.select(this).select('circle')
    .transition().duration(200)
    .attr('r', sizeScale(d.connections) * 1.3);
})
.on('mousemove', function(event) {
  tooltip
    .style('left', (event.clientX + 16) + 'px')
    .style('top', (event.clientY - 10) + 'px');
})
.on('mouseout', function(event, d) {
  tooltip.style('opacity', 0);

  node.select('circle')
    .attr('fill-opacity', 0.85)
    .attr('stroke-opacity', 0.4);

  node.selectAll('text')
    .attr('fill-opacity', 0.7);

  link
    .attr('stroke-opacity', 1)
    .attr('stroke', e => e.type === 'hierarchical' ? 'rgba(95, 200, 155, 0.45)' : 'rgba(95, 200, 155, 0.15)')
    .attr('stroke-width', e => e.type === 'hierarchical' ? 1.5 : 0.8);

  d3.select(this).select('circle')
    .transition().duration(200)
    .attr('r', sizeScale(d.connections));
})
.on('click', function(event, d) {
  event.stopPropagation();
  openPanel(d);
});

// Click on background to close panel
svg.on('click', () => closePanel());

// Simulation tick
simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

// Drag
function dragstarted(event) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  event.subject.fx = event.subject.x;
  event.subject.fy = event.subject.y;
}

function dragged(event) {
  event.subject.fx = event.x;
  event.subject.fy = event.y;
}

function dragended(event) {
  if (!event.active) simulation.alphaTarget(0);
  event.subject.fx = null;
  event.subject.fy = null;
}

// ============================================
// Side Panel
// ============================================
function openPanel(d) {
  const panel = document.getElementById('side-panel');
  const content = document.getElementById('panel-content');

  const statusColors = { canonical: '#5FC89B', review: '#E8B84A', draft: '#8B9DAF' };
  const statusBg = { canonical: 'rgba(95,200,155,0.15)', review: 'rgba(232,184,74,0.15)', draft: 'rgba(139,157,175,0.15)' };

  // Get connections
  const broader = [], narrower = [], related = [];
  graphData.edges.forEach(e => {
    const s = typeof e.source === 'string' ? e.source : e.source.id;
    const t = typeof e.target === 'string' ? e.target : e.target.id;
    if (e.type === 'hierarchical') {
      if ((d.broader || []).includes(t) || (d.broader || []).includes(s)) {
        if (s === d.id && nodeMap[t]) broader.push(nodeMap[t]);
        if (t === d.id && nodeMap[s]) broader.push(nodeMap[s]);
      }
      if ((d.narrower || []).includes(t) || (d.narrower || []).includes(s)) {
        if (s === d.id && nodeMap[t]) narrower.push(nodeMap[t]);
        if (t === d.id && nodeMap[s]) narrower.push(nodeMap[s]);
      }
    }
  });

  // Rebuild from raw data
  const broaderNodes = (d.broader || []).filter(id => nodeMap[id]).map(id => nodeMap[id]);
  const narrowerNodes = (d.narrower || []).filter(id => nodeMap[id]).map(id => nodeMap[id]);
  const relatedNodes = (d.related || []).filter(id => nodeMap[id]).map(id => nodeMap[id]);

  function renderLinks(nodes) {
    if (!nodes.length) return '<div class="panel-empty">None</div>';
    return nodes.map(n =>
      `<a class="panel-link" onclick="navigateTo('${n.id}')">${n.title} <span style="opacity:0.4;font-size:10px">${n.status}</span></a>`
    ).join('');
  }

  content.innerHTML = `
    <div class="panel-title">${d.title}</div>
    <div class="panel-slug">${d.id}</div>
    <div class="panel-badge" style="background:${statusBg[d.status]};color:${statusColors[d.status]}">${d.status}</div>

    <div class="panel-section">
      <h3>Broader (parent concepts)</h3>
      ${renderLinks(broaderNodes)}
    </div>

    <div class="panel-section">
      <h3>Narrower (child concepts)</h3>
      ${renderLinks(narrowerNodes)}
    </div>

    <div class="panel-section">
      <h3>Related</h3>
      ${renderLinks(relatedNodes)}
    </div>

    <div class="panel-section">
      <h3>Statistics</h3>
      <div style="font-size:12px;color:rgba(245,245,240,0.5);line-height:1.8">
        Total connections: <span style="color:#5FC89B;font-weight:400">${d.connections}</span><br>
        Broader: <span style="color:#F5F5F0">${broaderNodes.length}</span> &nbsp;
        Narrower: <span style="color:#F5F5F0">${narrowerNodes.length}</span> &nbsp;
        Related: <span style="color:#F5F5F0">${relatedNodes.length}</span>
      </div>
    </div>
  `;

  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
}

function navigateTo(id) {
  const n = nodeMap[id];
  if (!n) return;

  // Center on node
  const transform = d3.zoomTransform(svg.node());
  const targetX = width / 2 - n.x * transform.k;
  const targetY = height / 2 - n.y * transform.k;

  svg.transition().duration(750)
    .call(zoom.transform, d3.zoomIdentity.translate(targetX, targetY).scale(transform.k));

  // Open panel for the new node
  setTimeout(() => openPanel(n), 200);

  // Pulse effect
  node.filter(d => d.id === id)
    .select('circle')
    .transition().duration(300)
    .attr('r', sizeScale(n.connections) * 1.8)
    .attr('fill-opacity', 1)
    .transition().duration(500)
    .attr('r', sizeScale(n.connections))
    .attr('fill-opacity', 0.85);
}

// ============================================
// Search
// ============================================
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', function() {
  const query = this.value.toLowerCase().trim();

  if (!query) {
    node.select('circle')
      .attr('fill-opacity', 0.85)
      .attr('stroke-opacity', 0.4);
    node.selectAll('text')
      .attr('fill-opacity', 0.7);
    link.attr('stroke-opacity', 1);
    return;
  }

  const matches = new Set();
  graphData.nodes.forEach(n => {
    if (n.title.toLowerCase().includes(query) || n.id.toLowerCase().includes(query)) {
      matches.add(n.id);
    }
  });

  node.select('circle')
    .attr('fill-opacity', n => matches.has(n.id) ? 1 : 0.08)
    .attr('stroke-opacity', n => matches.has(n.id) ? 1 : 0.02)
    .attr('stroke-width', n => matches.has(n.id) ? 3 : 1.5);

  node.selectAll('text')
    .attr('fill-opacity', n => matches.has(n.id) ? 1 : 0.05);

  link.attr('stroke-opacity', 0.03);

  // If only one match, center on it
  if (matches.size === 1) {
    const id = [...matches][0];
    const n = nodeMap[id];
    if (n && n.x && n.y) {
      const transform = d3.zoomTransform(svg.node());
      svg.transition().duration(600)
        .call(zoom.transform, d3.zoomIdentity.translate(width/2 - n.x * 1.2, height/2 - n.y * 1.2).scale(1.2));
    }
  }
});

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchInput.dispatchEvent(new Event('input'));
    searchInput.blur();
    closePanel();
  }
});

// Warm up simulation
simulation.alpha(1).restart();
setTimeout(() => simulation.alphaTarget(0), 5000);
</script>

</body>
</html>
