# SRL Knowledge Vault — Subject Vocabulary
#
# SKOS-lite controlled vocabulary for `dc:subject` tags.
# Initial version 0.1 — 2026-04-18 governance cleanup.
#
# Scope of v0.1:
#   - canonical: tags with ≥5 documented usages in the vault. Preferred labels
#                established and alt_labels cover known case/hyphen variants.
#   - provisional: tags with 3-4 usages. Preferred label accepted tentatively;
#                  broader/narrower relations not yet wired.
#   - The long tail (1,551 tags with 1-2 usages) is not enumerated here.
#     New writes should prefer canonical or provisional labels. Genuinely new
#     subjects are allowed but should graduate to provisional → canonical on
#     review cycles.
#
# Casing rule: lowercase kebab-case. Acronyms lowercased. No trademarks or
# proper nouns preserved in casing (those belong in `aliases` on the relevant
# concept or evidence note, not in dc:subject).
#
# Validation:
#   - vault-writer bot checks dc:subject values against this file
#   - unknown tags → warning for now, block after 2026-05-01 (hard gate date)
#   - alt_labels are resolved to preferred at write time where feasible
#
# Format:
#   subject-slug:
#     preferred_label: human-readable name
#     alt_labels: [list of known variant spellings to canonicalize]
#     broader: [list of parent subject slugs]
#     narrower: [list of child subject slugs]   # rare; mostly derived from broader
#     scope_note: short definition or usage constraint
#     tier: canonical | provisional

version: "0.1"
created: "2026-04-18"
hard_gate_date: "2026-05-01"

